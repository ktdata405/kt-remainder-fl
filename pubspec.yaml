name: kt_remainder_fl
description: Reminder app with Google Sheet sync. Supports Android and Web.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.0.0   # Android only; gracefully skipped on web
  flutter_timezone: ^4.1.1
  timezone: ^0.9.0
  http: ^1.2.0
  shared_preferences: ^2.3.0
  sqflite: ^2.3.0
  path: ^1.9.0
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  web:
    generate: true
    image_path: assets/icons/reminder_icon.png
    background_color: "#4F46E5"
    theme_color: "#4F46E5"
  image_path: assets/icons/reminder_icon.png
  min_sdk_android: 21

