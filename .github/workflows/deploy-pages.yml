name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate committed app_config.dart
        run: |
          if [ ! -f lib/config/app_config.dart ]; then
            echo "::error::lib/config/app_config.dart is missing. Commit this file with your Web App URL."
            exit 1
          fi
          if grep -q "PASTE_YOUR" lib/config/app_config.dart; then
            echo "::error::app_config.dart still contains placeholder URL."
            exit 1
          fi

      - name: Build web app
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"

          # Use root base path for user/organization pages, repo subpath for project pages.
          if [ "$repo" = "$owner.github.io" ]; then
            base_href="/"
          else
            base_href="/$repo/"
          fi

          echo "Using base href: $base_href"
          flutter build web --release --base-href "$base_href"

      - name: SPA fallback for GitHub Pages
        run: cp build/web/index.html build/web/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


